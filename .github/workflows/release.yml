---
name: Release
on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Tag and publish release
    runs-on: ubuntu-24.04
    # Only run for merge commits, so direct pushes to main don't cut a release.
    if: startsWith(github.event.head_commit.message, 'Merge pull request')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute next version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          latest=$(git tag --list 'v*' --sort=-v:refname | head -n 1)

          if [[ -z "${latest}" ]]; then
            major=1
            minor=0
            patch=0
          else
            IFS='.' read -r major minor patch <<< "${latest#v}"
            patch=$((patch + 1))
          fi

          next="v${major}.${minor}.${patch}"
          echo "latest=${latest:-none} -> next=${next}" >> "${GITHUB_STEP_SUMMARY}"
          echo "tag=${next}" >> "${GITHUB_OUTPUT}"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail

          # --target pins the release to the exact commit that triggered this run.
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${TARGET}" \
            --title "${TAG}" \
            --generate-notes
