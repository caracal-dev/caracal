# GDM configuration storage
#
# This template is edited at boot by caracal-autologin.service: on fresh
# installs it enables an automatic login for the bootstrap user so the
# Caracal setup wizard can create the primary user; once a real user exists
# the service comments the keys back out (default = no autologin).

[daemon]
#AutomaticLoginEnable=True
#AutomaticLogin=
#WaylandEnable=False
#DefaultSession=

[security]

[xdmcp]

[chooser]

[debug]
#Enable=true