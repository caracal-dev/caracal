# Caracal baseline ALSA audio tuning for low-latency DAW work.
# Reduces buffer latency while preventing xruns.
# Applied to all ALSA capture and playback nodes.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_input.*"
      }
      {
        node.name = "~alsa_output.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.period-size = 256
        api.alsa.headroom   = 1024
      }
    }
  }
]