# Caracal ALSA audio tuning for low-latency DAW work.
# Keeps ALSA audio devices from suspending to prevent first-playback
# latency spikes. Buffer-size negotiation is left to PipeWire's quantum
# bounds (99-caracal-pro-audio.conf) and per-application requests — no
# global period-size override that causes xruns under browser/desktop load.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_input.*"
      }
      {
        node.name = "~alsa_output.*"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]