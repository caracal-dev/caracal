# Caracal Bluetooth audio profile lock.
# Prevents automatic A2DP-to-HFP profile switching that degrades audio quality.
# The HFP profile is dropped from allowed roles, keeping headsets on high-quality
# A2DP at all times. Headset microphone functionality is unavailable — if you
# need mic input, remove or comment this file and restart WirePlumber.
monitor.bluez.rules = [
  {
    matches = [
      {
        # Match all Bluetooth audio nodes
        device.name = "~bluez_card.*"
      }
    ]
    actions = {
      update-props = {
        bluez5.roles = [ a2dp_sink a2dp_source ]
        bluez5.enable-sbc-xq = true
        bluez5.enable-msbc = false
        bluez5.hfphsp-backend = "native"
      }
    }
  }
]

# Also disable autoswitch at the global WirePlumber level to catch all paths
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}