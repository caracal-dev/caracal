# Caracal pro-audio: PipeWire quantum stability
#
# Bounds the quantum (audio buffer size) range that PipeWire will accept from
# any application. Without bounds, PipeWire can renegotiate the quantum
# mid-session when a new client joins with a different preference. Convolution
# and cabinet-simulation plugins (JUCE-based or otherwise) size their FFT/IR
# buffers once at initialisation; a surprise quantum change after that can
# corrupt internal state and cause crashes (memset into a stale buffer, etc.).
#
# These are BOUNDS, not forced values — applications like REAPER that request
# a specific quantum via SPA_PARAM_Latency will still get their own preferred
# buffer size as long as it falls within [min, max].
#
# min-quantum 64:   prevents sub-64 quanta that stress convolution math and
#                   leave insufficient headroom for plugin processing.
# max-quantum 2048: prevents unexpectedly large quanta that trigger IR/FFT
#                   re-allocation in convolution plugins mid-session.
#
# allowed-rates: restricts negotiated sample rates to common pro-audio values,
# preventing spontaneous rate renegotiation (e.g. when a new client requests
# 32000 Hz) that would require convolution plugins to resize their IR buffers.

context.properties = {
    default.clock.min-quantum  = 64
    default.clock.max-quantum  = 2048
    default.clock.allowed-rates = [ 44100 48000 88200 96000 176400 192000 ]

    # Default clock: 48000 Hz at 256-frame quantum.
    # 48000 Hz is the universal DAW sample rate (all interfaces support it).
    # 256 frames at 48000 Hz = 5.3 ms latency — low enough for real-time
    # monitoring, high enough to keep convolution plugins stable.
    # Applications (REAPER, Bitwig, etc.) can still request their own quantum
    # within [64, 2048] via SPA_PARAM_Latency.
    default.clock.rate     = 48000
    default.clock.quantum  = 256
}
