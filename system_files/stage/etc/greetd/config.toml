# Caracal Stage greetd configuration.
#
# This file is regenerated on every boot by caracal-stage-autologin.service,
# which resolves the installer-created uid-1000 user (unknown at image build
# time) and writes the [initial_session] autologin block below it.
#
# If autologin cannot be configured, greetd falls back to the agreety text
# greeter, which still launches the Caracal Stage session on login.

[terminal]
vt = 1

[default_session]
command = "agreety --cmd /usr/bin/caracal-stage-session"
user = "greeter"
