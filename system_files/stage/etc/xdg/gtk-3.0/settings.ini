# ── Caracal Stage GTK Settings ─────────────────────────────────
#   Touch-optimized: larger font, larger cursor, wider scrollbars.
#   Colors: Catppuccin Macchiato / Kanagawa Dragon blend.
# ──────────────────────────────────────────────────────────────────

[Settings]
gtk-font-name = Cantarell 12
gtk-cursor-theme-name = Adwaita
gtk-cursor-theme-size = 32
gtk-icon-theme-name = Adwaita
gtk-theme-name = Adwaita
gtk-fallback-theme = Adwaita
gtk-button-images = 1
gtk-menu-images = 1
gtk-enable-event-sounds = 0
gtk-enable-input-feedback-sounds = 0
gtk-xft-antialias = 1
gtk-xft-hinting = 1
gtk-xft-hintstyle = hintfull
gtk-xft-rgba = rgb
gtk-primary-button-warps-slider = 1
gtk-overlay-scrolling = 0
gtk-ellipsize-mode = none
gtk-decorate-layout = 1