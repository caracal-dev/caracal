[background]
image = /usr/share/backgrounds/caracal/caracal-sunset.png
preserve_aspect = false

[panel]
autohide = false
height = 48
layer = top
position = top
clock_format = %H:%M
menu_icon = /usr/share/icons/caracal/caracal.svg
menu_logout_command = /usr/bin/caracal-stage-wlogout
widgets_left = launchers window-list
widgets_center = clock
widgets_right = tray

[dock]
autohide = false
icon_size = 64
layer = overlay
position = bottom

[launcher]
carla = carla.desktop
terminal = org.codeberg.dnkl.foot.desktop