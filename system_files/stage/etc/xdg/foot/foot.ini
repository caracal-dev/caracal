# ── Caracal Stage Foot ─────────────────────────────────────────
#   Touch-optimized: larger font, visible scrollbar.
#   Matches Waybar theme colors (Kanagawa Dragon / Catppuccin).
# ──────────────────────────────────────────────────────────────────

[main]
font = monospace:size=12
dpi-aware = yes
pad = 8x8

[scrollbar]
show = always

[cursor]
style = block
blink = yes

[colors]
foreground = cad3f5
background = 1a1b26
regular0 = 363a4f
regular1 = ed8796
regular2 = a6da95
regular3 = eed49f
regular4 = 8aadf4
regular5 = c6a0f6
regular6 = 8bd5ca
regular7 = cad3f5
bright0 = 424758
bright1 = ed8796
bright2 = a6da95
bright3 = eed49f
bright4 = 8aadf4
bright5 = c6a0f6
bright6 = 8bd5ca
bright7 = a5adcb