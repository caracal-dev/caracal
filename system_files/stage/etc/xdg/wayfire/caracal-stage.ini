[core]
plugins = autostart command decoration expo fast-switcher grid idle input-method invert move oswitch place resize scale switcher touch vswipe vswitch window-rules wm-actions wobbly zoom showtouch animate wayfire-shell foreign-toplevel
xwayland = true

[autostart]
carla = /usr/bin/caracal-stage-carla
waybar = /usr/bin/caracal-stage-waybar
keyboard = wvkbd-mobintl --auto-show --auto-hide --osc-layout
mako = mako
background = swaybg -i /usr/share/backgrounds/caracal/caracal-sunset.png -m fill
autostart_wf_shell = false

[command]
binding_terminal = <super> KEY_ENTER
command_terminal = foot
binding_launcher = <super> KEY_D
command_launcher = carla
binding_keyboard = <super> KEY_K
command_keyboard = pkill wvkbd-mobintl
binding_quit = <super> <shift> KEY_Q
command_quit = pkill wayfire
binding_menu = <super>
command_menu = wofi -S drun -W 3 --columns 3 --allow-close --hide-scroll

[grid]
slot_l = <super> KEY_LEFT
slot_r = <super> KEY_RIGHT
slot_c = <super> KEY_UP
restore = <super> KEY_DOWN

[idle]
dpms_timeout = -1
screensaver_timeout = -1

[expo]
duration = 250
offset = 10

[scale]
duration = 200
spacing = 24
toggle = <super> KEY_TAB

[showtouch]
center_color = #8aadf480
finger_color = #8bd5ca80
touch_duration = 300ms sigmoid
touch_radius = 32

[vswipe]
duration = 220
delta_threshold = 18.0
enable_free_movement = true
fingers = 3
gap = 18
speed_cap = 0.08

[input]
cursor_size = 32
cursor_hide_timeout = 3000
disable_touchpad_while_mouse = false
tap_to_click = true
touchpad_cursor_speed = 0.25

[wayfire-shell]
toggle_menu = <super>

[window-rules]
maximize_carla = on created if app_id is "Carla2" then maximize
maximize_carla_xwayland = on created if title contains "Carla" then maximize

[decoration]
button_order = close maximize minimize
active_color = #363a4f
inactive_color = #1a1b26
border_size = 2
title_font = Cantarell 11
title_color = #cad3f5
title_inactive_color = #a5adcb
button_color = #8aadf4
button_hover_color = #b7bdf8
button_close_color = #ed8796
button_minimize_color = #eed49f
button_maximize_color = #a6da95